<!DOCTYPE html>
<html>
<body>

<button onclick="gen()">Generate</button>
<h2 id="pass"></h2>

<script>
function gen(){
    let chars = "abc123!@#";
    let p = "";
    for(let i=0;i<8;i++){
        p += chars[Math.floor(Math.random()*chars.length)];
    }
    pass.innerText = p;
}
</script>

</body>
</html>
