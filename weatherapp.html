<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weather App </title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(to right, #4facfe, #00f2fe);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

.app {
    background: white;
    padding: 25px;
    border-radius: 12px;
    width: 320px;
    text-align: center;
    box-shadow: 0 4px 15px rgba(0,0,0,0.2);
}

h2 {
    margin-bottom: 10px;
}

input {
    width: 85%;
    padding: 10px;
    margin-top: 10px;
    border-radius: 5px;
    border: 1px solid #ccc;
}

button {
    padding: 10px 15px;
    margin-top: 12px;
    border: none;
    background: #007BFF;
    color: white;
    border-radius: 5px;
    cursor: pointer;
}

button:hover {
    background: #0056b3;
}

.result {
    margin-top: 20px;
    font-size: 16px;
}
</style>

</head>
<body>

<div class="app">
    <h2>🌦️ Weather App</h2>

    <input id="city" placeholder="Enter city (e.g. Hyderabad)">
    <br>
    <button onclick="getWeather()">Search</button>

    <div class="result" id="result"></div>
</div>

<script>
async function getWeather() {
    const city = document.getElementById("city").value.trim();
    const result = document.getElementById("result");

    if (city === "") {
        result.innerHTML = "⚠️ Please enter a city name";
        return;
    }

    try {
        // ✅ NO API KEY USED HERE
        const response = await fetch(`https://wttr.in/${city}?format=j1`);

        if (!response.ok) {
            result.innerHTML = "❌ Unable to fetch weather";
            return;
        }

        const data = await response.json();
        console.log(data); // Debug

        // Extract data safely
        const current = data.current_condition[0];

        result.innerHTML = `
            <h3>${city}</h3>
            <p>🌡️ Temperature: ${current.temp_C} °C</p>
            <p>☁️ Condition: ${current.weatherDesc[0].value}</p>
            <p>💧 Humidity: ${current.humidity}%</p>
            <p>🌬️ Wind: ${current.windspeedKmph} km/h</p>
        `;
    } catch (error) {
        result.innerHTML = "⚠️ Network error";
    }
}
</script>

</body>
</html>
