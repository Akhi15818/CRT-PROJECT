<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Digital Clock</title>

<style>
body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #ddd;
    font-family: Arial;
}

/* Outer circular body */
.clock-body {
    width: 280px;
    height: 280px;
    background: orange;
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* Inner screen */
.screen {
    width: 220px;
    height: 120px;
    background: black;
    border-radius: 15px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
}

/* Time display */
.time {
    color: #00ffcc;
    font-size: 40px;
    letter-spacing: 3px;
}

/* Extra info */
.info {
    color: white;
    font-size: 12px;
    margin-top: 5px;
}
</style>

</head>
<body>

<div class="clock-body">
    <div class="screen">
        <div id="time" class="time">00:00</div>
        <div id="info" class="info">Loading...</div>
    </div>
</div>

<script>
function updateClock() {
    let now = new Date();

    let hours = now.getHours().toString().padStart(2, '0');
    let minutes = now.getMinutes().toString().padStart(2, '0');
    let seconds = now.getSeconds().toString().padStart(2, '0');

    let timeString = `${hours}:${minutes}:${seconds}`;
    document.getElementById("time").innerText = timeString;

    // Extra info (date + AM/PM)
    let ampm = hours >= 12 ? "PM" : "AM";
    let date = now.toDateString();

    document.getElementById("info").innerText = `${ampm} | ${date}`;
}

// Update every second
setInterval(updateClock, 1000);
updateClock();
</script>

</body>
</html>
