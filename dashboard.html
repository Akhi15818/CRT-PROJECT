<!DOCTYPE html>
<html>
<head>
<title>Dashboard</title>
<style>
.container {
    display: flex;
}
.sidebar {
    width: 200px;
    background: black;
    color: white;
    height: 100vh;
}
.main {
    flex: 1;
    padding: 20px;
}
.cards {
    display: flex;
    gap: 10px;
}
.card {
    background: #eee;
    padding: 20px;
    flex: 1;
}
</style>
</head>
<body>

<div class="container">
    <div class="sidebar">Menu</div>
    <div class="main">
        <div class="cards">
            <div class="card">Users</div>
            <div class="card">Sales</div>
        </div>
    </div>
</div>

</body>
</html>
