<!DOCTYPE html>
<html>
<head>
<title>Shop</title>
<style>
.products {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
}
.card {
    border: 1px solid #ccc;
    padding: 10px;
}
</style>
</head>
<body>

<h1>Shop</h1>

<div class="products">
    <div class="card">Product 1</div>
    <div class="card">Product 2</div>
    <div class="card">Product 3</div>
</div>

</body>
</html>
