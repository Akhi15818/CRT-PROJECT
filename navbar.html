<!DOCTYPE html>
<html>
<head>
<title>Navbar</title>
<style>
body { margin:0; font-family:Arial; }

.navbar {
    background: black;
    color: white;
    padding: 10px;
}
.navbar a {
    color: white;
    margin: 10px;
    text-decoration: none;
}

.footer {
    background: black;
    color: white;
    text-align: center;
    padding: 10px;
    position: fixed;
    bottom: 0;
    width: 100%;
}
</style>
</head>
<body>

<div class="navbar">
    <a href="#">Home</a>
    <a href="#">About</a>
</div>

<div style="padding:50px;">
    <h1>Content Area</h1>
</div>

<div class="footer">
    <p>© 2026 Website</p>
</div>

</body>
</html>
