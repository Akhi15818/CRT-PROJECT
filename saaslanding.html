<!DOCTYPE html>
<html>
<head>
<title>SaaS Landing Page</title>
<style>
body {
    margin: 0;
    font-family: Arial;
}

header {
    background: #007BFF;
    color: white;
    padding: 50px;
    text-align: center;
}

.section {
    padding: 40px;
    text-align: center;
}

.features {
    display: flex;
    gap: 20px;
}

.feature {
    flex: 1;
    padding: 20px;
    border: 1px solid #ccc;
}

.pricing {
    display: flex;
    gap: 20px;
}

.card {
    flex: 1;
    border: 1px solid black;
    padding: 20px;
}
</style>
</head>
<body>

<header>
    <h1>My SaaS Product</h1>
    <p>Boost your productivity</p>
</header>

<div class="section">
    <h2>Features</h2>
    <div class="features">
        <div class="feature">Fast</div>
        <div class="feature">Secure</div>
        <div class="feature">Reliable</div>
    </div>
</div>

<div class="section">
    <h2>Pricing</h2>
    <div class="pricing">
        <div class="card">Basic</div>
        <div class="card">Pro</div>
    </div>
</div>

</body>
</html>
