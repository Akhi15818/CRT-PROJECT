<!DOCTYPE html>
<html>
<head>
<title>Login</title>
<style>
body {
    font-family: Arial;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}
form {
    border: 1px solid #ccc;
    padding: 30px;
    width: 300px;
}
input {
    width: 100%;
    margin: 10px 0;
    padding: 8px;
}
button {
    width: 100%;
    padding: 10px;
}
</style>
</head>
<body>

<form>
    <h2>Login</h2>
    <input type="email" placeholder="Email">
    <input type="password" placeholder="Password">
    <button>Login</button>
</form>

</body>
</html>
