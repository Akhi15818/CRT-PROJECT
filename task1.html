<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Task 7</title>
  <style>
    form {
      width: 300px;
      margin: auto;
      padding: 15px;
      border: 1px solid #333;
      border-radius: 8px;
    }
    label {
      display: block;
      margin-top: 10px;
    }
    input {
      width: 100%;
      padding: 5px;
      margin-top: 5px;
    }
    button {
      margin-top: 15px;
      padding: 10px;
      background: blue;
      color: white;
      border: none;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>User Form</h1>
  <form>
    <label>Name:</label>
    <input type="text" name="name" required>

    <label>Age:</label>
    <input type="number" name="age" required>

    <label>Designation:</label>
    <input type="text" name="designation">

    <label>Email:</label>
    <input type="email" name="email" required>

    <label>Password:</label>
    <input type="password" name="pwd" required>

    <label>Date of Birth:</label>
    <input type="date" name="dob">

    <button type="submit">Submit</button>
  </form>

  <!-- Insert Image -->
  <img src="form_icon.png" alt="Form Illustration" width="150">
</body>
</html>
