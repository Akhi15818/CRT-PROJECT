<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task 8</title>
  <style>
    .bg-container {
      width: 600px;
      height: 300px;
      background-image: url('your-image.jpg'); /* replace with your image */
      background-size: cover;
      background-position: center;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      font-size: 24px;
      font-weight: bold;
    }

    .overlay {
      text-align: center;
    }

    .overlay button {
      margin-top: 10px;
      padding: 10px 20px;
      font-size: 16px;
      background: #007BFF;
      border: none;
      color: white;
      border-radius: 5px;
      cursor: pointer;
    }

    .overlay button:hover {
      background: #0056b3;
    }
  </style>
</head>
<body>
  <div class="bg-container">
    <div class="overlay">
      <p>This is Task 8</p>
      <button>Click Me</button>
    </div>
  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task 10</title>
  <style>
    .flex-container {
      display: flex;
      justify-content: space-around;
      align-items: center;
      flex-wrap: wrap;
      padding: 20px;
      background: #f4f4f4;
    }

    .flex-item {
      width: 250px;
      height: 150px;
      background: lightblue;
      border: 2px solid #333;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 20px;
      font-weight: bold;
      margin: 10px;
    }
  </style>
</head>
<body>
  <div class="flex-container">
    <div class="flex-item">Box 1</div>
    <div class="flex-item">Box 2</div>
    <div class="flex-item">Box 3</div>
    <div class="flex-item">Box 4</div>
  </div>
</body>
</html>
